logging:
  level:
    root: INFO
    de.bund.bva.isyfact: INFO
    org.example: INFO

# it was required for IsyFact logging lib
isy:
  logging:
    anwendung:
      name: DenaApp
      typ: backend
      version: 1.0.0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dena
    username: postgres
    password: password
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.yaml

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui