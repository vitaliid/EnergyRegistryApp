logging:
  level:
    root: INFO
    de.bund.bva.isyfact: INFO
    org.example: INFO
    org.hibernate.stat: DEBUG
    org.hibernate.cache: DEBUG
    org.hibernate.SQL: DEBUG


# it was required for IsyFact logging lib
isy:
  logging:
    anwendung:
      name: EnergyRegistryApp
      typ: backend
      version: 1.0.0

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: energyregistry-app
  prometheus:
    metrics:
      export:
        enabled: true

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/energyregistry
    username: postgres
    password: password
  jpa:
    show-sql: true
    properties:
      org.hibernate.envers.global_with_modified_flag: true
      hibernate:
        envers:
          autoRegisterListeners: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        generate_statistics: true
        cache:
          use_second_level_cache: true
          use_query_cache: true
          javax:
            cache:
              provider: org.ehcache.jsr107.EhcacheCachingProvider
          cache:
            region:
              factory_class: jcache
        search:
          backend:
            type: lucene
            directory:
              type: local-filesystem
              root: ./build/hibernate-search-indexes
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/energyregistry-realm
          jwk-set-uri: http://localhost:9090/realms/energyregistry-realm/protocol/openid-connect/certs
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      transaction-id-prefix: energyregistry-user-action-${HOSTNAME:local}-
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: energyregistry-user-action-log-writer
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: org.example
        spring.json.value.default.type: org.example.domain.logging.UserActionEvent
    listener:
      ack-mode: record

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

app:
  kafka:
    topics:
      user-actions: energyregistry.user-actions.v1
  energy:
    threshold: 1000
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: energyregistry-energy-uploads