openapi: 3.0.3
info:
  title: Example Store API
  version: 1.0.0
  description: Small example API for testing Java code generation.

servers:
  - url: https://api.example.com/v1
    description: Production server
  - url: http://localhost:8080/v1
    description: Local development server

security:
  - bearerAuth: []

paths:
  /products:
    get:
      tags:
        - Products
      summary: List products
      operationId: listProducts
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          example: books
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags:
        - Products
      summary: Create product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created
          headers:
            Location:
              description: URL of the created product
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /products/{productId}:
    get:
      tags:
        - Products
      summary: Get product by ID
      operationId: getProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Products
      summary: Update product
      operationId: updateProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Products
      summary: Delete product
      operationId: deleteProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Product deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /orders:
    post:
      tags:
        - Orders
      summary: Create order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ProductPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        nextCursor:
          type: string
          nullable: true
          example: eyJwYWdlIjoyfQ==

    Product:
      type: object
      required:
        - id
        - name
        - price
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: 9f2b7c8d-5d3a-4a7a-9e7c-123456789abc
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Wireless Keyboard
        description:
          type: string
          nullable: true
          example: Compact mechanical keyboard.
        price:
          type: number
          format: double
          minimum: 0
          example: 79.99
        status:
          $ref: "#/components/schemas/ProductStatus"
        tags:
          type: array
          items:
            type: string
          example:
            - electronics
            - keyboard
        dimensions:
          $ref: "#/components/schemas/Dimensions"
        createdAt:
          type: string
          format: date-time
          example: 2026-06-15T10:30:00Z

    CreateProductRequest:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          nullable: true
        price:
          type: number
          format: double
          minimum: 0
        tags:
          type: array
          items:
            type: string
        dimensions:
          $ref: "#/components/schemas/Dimensions"

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          nullable: true
        price:
          type: number
          format: double
          minimum: 0
        status:
          $ref: "#/components/schemas/ProductStatus"
        tags:
          type: array
          items:
            type: string

    ProductStatus:
      type: string
      enum:
        - DRAFT
        - ACTIVE
        - ARCHIVED
      example: ACTIVE

    Dimensions:
      type: object
      properties:
        width:
          type: number
          format: double
          example: 30.5
        height:
          type: number
          format: double
          example: 2.8
        depth:
          type: number
          format: double
          example: 12.0
        unit:
          type: string
          enum:
            - cm
            - in
          default: cm

    CreateOrderRequest:
      type: object
      required:
        - productId
        - quantity
        - shippingAddress
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          example: 2
        shippingAddress:
          $ref: "#/components/schemas/Address"

    Order:
      type: object
      required:
        - id
        - productId
        - quantity
        - status
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
        status:
          type: string
          enum:
            - PENDING
            - PAID
            - SHIPPED
            - CANCELLED
        shippingAddress:
          $ref: "#/components/schemas/Address"

    Address:
      type: object
      required:
        - line1
        - city
        - country
        - postalCode
      properties:
        line1:
          type: string
          example: 123 Main Street
        line2:
          type: string
          nullable: true
        city:
          type: string
          example: Berlin
        country:
          type: string
          minLength: 2
          maxLength: 2
          example: DE
        postalCode:
          type: string
          example: "10115"

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request payload is invalid.
        details:
          type: array
          items:
            type: string
          example:
            - price must be greater than or equal to 0